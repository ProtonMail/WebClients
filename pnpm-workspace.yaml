# Yarn resolved any range that a workspace satisfies to that workspace, including the `*` peer
# dependencies between @proton packages.
linkWorkspacePackages: true
# Yarn never installs missing peer dependencies; pnpm does by default.
autoInstallPeers: false
# The vendored @rowsncolumns packages import each other in cycles (see packageExtensions), and
# pnpm refuses to run `pnpm -r` tasks over a cyclic graph. turbo still rejects cycles between
# @proton packages.
ignoreWorkspaceCycles: true

# pnpm's default. electron-forge refuses to package unless node-linker is hoisted or a hoist
# pattern is set explicitly; the desktop apps package only the webpack output, not node_modules.
hoistPattern:
    - '*'

# @electron/rebuild pulls @electron/node-gyp from a GitHub commit, and pnpm has no per-package
# exception for it. Yarn accepted every git dependency (approvedGitRepositories: '**').
blockExoticSubdeps: false

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
    - '@proton/*'
    - '@proton-meet/*'
    - '@proton-docs/*'
    - '@protontech/*'
    - '@openpgp/*'
    - '@tpe/*'

allowBuilds:
    '@parcel/watcher': true
    '@sentry/cli': true
    '@swc/core': true
    electron: true
    electron-winstaller: true
    esbuild: true
    # Builds the custom bundle configured in applications/wallet/package.json.
    exifreader: true
    fs-xattr: true
    macos-alias: true
    # Copies the service worker into the workerDirectory configured in applications/lumo/package.json.
    msw: true
    unix-dgram: true
    unrs-resolver: true
    # Only print notices or install shell completion.
    core-js: false
    core-js-pure: false
    es5-ext: false
    netlify-cli: false
    protobufjs: false
    ttag-cli: false

patchedDependencies:
    '@electron-forge/core@7.11.2': patches/@electron-forge__core@7.11.2.patch
    # Touch-only fix: tapping from a cell in one table into another threw "Cell not found in table." and
    # locked the Docs editor. Upstream has the same check (0.52.0 has it); drop this when upgrading Lexical.
    '@lexical/table@0.31.2': patches/@lexical__table@0.31.2.patch
    '@mlc-ai/web-llm@0.2.32': patches/@mlc-ai__web-llm@0.2.32.patch
    '@pdf-lib/standard-fonts@1.0.0': patches/@pdf-lib__standard-fonts@1.0.0.patch
    eslint-plugin-monorepo-cop@1.0.2: patches/eslint-plugin-monorepo-cop@1.0.2.patch
    jsdom@26.1.0: patches/jsdom@26.1.0.patch
    rfc2047@2.0.1: patches/rfc2047@2.0.1.patch

# Missing peer declarations. Without them, these packages resolve the dependency through pnpm's
# hidden hoisting directory, which may hold a different version than the workspace uses.
packageExtensions:
    eslint-plugin-no-only-tests@3:
        # Its JSDoc types reference `eslint`.
        peerDependencies:
            eslint: '*'
    # Requires `electron`, which the desktop apps pin to different versions. Jest mocks are keyed by
    # resolved path, so `jest.mock('electron')` only applies if it shares the app's copy.
    # electron-log gets no peer. With one, a desktop app on another electron version than
    # @proton/shared bundles two copies of it and crashes on start.
    electron-store@8:
        peerDependencies:
            electron: '*'
        peerDependenciesMeta:
            electron:
                optional: true
    # vendor/rowsncolumns ship prebuilt dist/ that imports tslib, React and sibling packages it only
    # declares as peers, or not at all. The Sheets sync regenerates their manifests, so the
    # dependencies live here. Versions match docs-editor. Optional imports that were never installed
    # (plotly, y-websocket, @hocuspocus/provider, canvas, @rowsncolumns/pivot) are left out; charts'
    # plotly/plot.js is not imported by any other module.
    '@rowsncolumns/calculation-worker':
        dependencies:
            '@rowsncolumns/common-types': 'workspace:^'
            '@rowsncolumns/dag': 'workspace:^'
            '@rowsncolumns/fast-formula-parser': 'workspace:^'
