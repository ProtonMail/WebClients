catalogs:
    # React 19, for the apps that have moved to it. They load one React, their own, through the helpers in
    # packages/pack/webpack/react.ts and packages/vitest-config/src/react.ts, and type-check against it
    # through tsconfig.react19.json; once every app is here, this becomes the default catalog.
    react19:
        '@types/react': ^19.3.0
        '@types/react-dom': ^19.3.0
        react: ^19.3.1
        react-dom: ^19.3.1
    # Docs' Lexical, at the version @proton-docs/docs-editor needs. A Docs manifest declaring a name
    # that is also in the default catalog needs an exception (see utilities/repo-rules/README.md).
    docs:
        '@lexical/clipboard': 0.36.2
        '@lexical/code': 0.36.2
        '@lexical/hashtag': 0.36.2
        '@lexical/headless': 0.36.2
        '@lexical/html': 0.36.2
        '@lexical/link': 0.36.2
        '@lexical/list': 0.36.2
        '@lexical/markdown': 0.36.2
        '@lexical/overflow': 0.36.2
        '@lexical/react': 0.36.2
        '@lexical/rich-text': 0.36.2
        '@lexical/selection': 0.36.2
        '@lexical/table': 0.36.2
        '@lexical/text': 0.36.2
        '@lexical/utils': 0.36.2
        '@lexical/yjs': 0.36.2
        lexical: 0.36.2

# Yarn resolved any range that a workspace satisfies to that workspace, including the `*` peer
# dependencies between @proton packages.
linkWorkspacePackages: true
# Yarn never installs missing peer dependencies; pnpm does by default.
autoInstallPeers: false
# Fail the install on a cycle between workspace packages, through any dependency type.
disallowWorkspaceCycles: true

# pnpm's default. electron-forge refuses to package unless node-linker is hoisted or a hoist
# pattern is set explicitly; the desktop apps package only the webpack output, not node_modules.
hoistPattern:
    - '*'
    # React's types are declared at the root, at the default catalog's version, so libraries without their
    # own @types/react find those instead of whichever version pnpm hoists, which apps on the `react19`
    # catalog would make React 19's.
    - '!@types/react'
    - '!@types/react-dom'

# @electron/rebuild pulls @electron/node-gyp from a GitHub commit, and pnpm has no per-package
# exception for it. Yarn accepted every git dependency (approvedGitRepositories: '**').
blockExoticSubdeps: false

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
    - '@proton/*'
    - '@proton-meet/*'
    - '@proton-docs/*'
    - '@protontech/*'
    - '@openpgp/*'
    - '@tpe/*'

allowBuilds:
    '@parcel/watcher': true
    '@sentry/cli': true
    '@swc/core': true
    electron: true
    electron-winstaller: true
    esbuild: true
    # Builds the custom bundle configured in applications/wallet/package.json.
    exifreader: true
    fs-xattr: true
    macos-alias: true
    # Copies the service worker into the workerDirectory configured in applications/lumo/package.json.
    msw: true
    unix-dgram: true
    unrs-resolver: true
    # Only print notices or install shell completion.
    core-js: false
    core-js-pure: false
    es5-ext: false
    netlify-cli: false
    protobufjs: false
    ttag-cli: false

patchedDependencies:
    # The five Lexical patches are the same as @proton-docs/docs-editor's, which needs them applied.
    # The `lexical` one is with the unscoped packages below.
    # A code block in a language Prism has no grammar for (`kotlin` from Markdown) is highlighted as
    # JavaScript, as before 0.34.0. Without it the block is not highlighted and Tab on a selection
    # in it throws.
    '@lexical/code@0.36.2': patches/@lexical__code@0.36.2.patch
    # No direction inversion in right-to-left text, as before 0.34.0. Without it Left or Right
    # selects an inline image, and only the next press moves the caret past it.
    '@lexical/selection@0.36.2': patches/@lexical__selection@0.36.2.patch
    # Touch-only fixes: tapping from a cell in one table into another threw "Cell not found in table."
    # and locked the Docs editor (upstream has the same check from 0.52.0), and a touch drag across
    # cells selected nothing, which 0.33.0 and later alone break.
    '@lexical/table@0.36.2': patches/@lexical__table@0.36.2.patch
    # TabNodes written by Lexical before 0.32.1 can hold more than a tab character, and from 0.32.1
    # TabNode.setTextContent throws on them, so the paragraph loaded empty. This restores 0.32.0's
    # direct write; @proton-docs/docs-editor's FixBrokenTabNode then repairs the tab. It also ignores
    # the direction Lexical before 0.30.0 stored for a block, which would otherwise stay whatever
    # its text is now.
    '@lexical/yjs@0.36.2': patches/@lexical__yjs@0.36.2.patch
    '@mlc-ai/web-llm@0.2.32': patches/@mlc-ai__web-llm@0.2.32.patch
    '@pdf-lib/standard-fonts@1.0.0': patches/@pdf-lib__standard-fonts@1.0.0.patch
    # LUMO-988: copy the full scaled iframe bitmap instead of its top-left quarter.
    # Reassess on upgrades: remove only when the unpatched replacement passes
    # tests/lumo/iframe-capture.test.ts in Chromium and WebKit at scales 1 and 2;
    # otherwise update the patch for the replacement version.
    html2canvas@1.4.1: patches/html2canvas@1.4.1.patch
    # Docs: each list item and each paragraph in a table cell keeps the direction of its own text,
    # as before 0.35.0 (without it, it takes the direction of the first text in its list or table),
    # and a direction stored in pasted or saved content is ignored. Same as @proton-docs/docs-editor's.
    lexical@0.36.2: patches/lexical@0.36.2.patch
    # Preserve email autolinking without unsupported negative lookbehind on Safari <16.4.
    # https://github.com/syntax-tree/mdast-util-gfm-autolink-literal/issues/10
    mdast-util-gfm-autolink-literal@2.0.1: patches/mdast-util-gfm-autolink-literal@2.0.1.patch
    rfc2047@2.0.1: patches/rfc2047@2.0.1.patch

# Missing peer declarations. Without them, these packages resolve the dependency through pnpm's
# hidden hoisting directory, which may hold a different version than the workspace uses.
packageExtensions:
    # Requires `electron`, which the desktop apps pin to different versions.
    # electron-log gets no peer. With one, a desktop app on another electron version than
    # @proton/shared bundles two copies of it and crashes on start.
    electron-store@8:
        peerDependencies:
            electron: '*'
        peerDependenciesMeta:
            electron:
                optional: true
    # Declare @types/react as a dependency of any version, which pnpm resolves to the newest in the
    # workspace: React 19's once an app is on the `react19` catalog. As a peer it follows the workspace.
    '@types/react-router@5':
        peerDependencies:
            '@types/react': '*'
    '@types/react-router-dom@5':
        peerDependencies:
            '@types/react': '*'

