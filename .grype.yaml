fail-on-severity: "high"
ignore:
  # Statuses
  - fix-state: not-fixed
  - fix-state: unknown
  - fix-state: wont-fix

  # Vulnerabilities
  # How to fix them:
  #  - remove the entry you aim to fix from the following list
  #  - check in the CI that is failing
  #  - patch/update the target dependency accordingly
  #  - the CI should be green and that's it
  #
  # Keep npm accepted-risk GHSAs in sync with .proton/reviewbot/config.yaml (ignoreRules).

  ## Go
  # Safe to ignore: Go is not used in production. The only Go code in this repo is a
  # change set generation script and is never shipped or executed in a production environment.
  - package:
      type: go-module

  ## Npm
  - vulnerability: GHSA-phwq-j96m-2c2q
    package:
      name: ejs
      type: npm
      version: 2.7.4
  - vulnerability: GHSA-593f-38f6-jp5m
    package:
      name: koa
      type: npm
      version: 2.15.3
  - vulnerability: GHSA-76p3-8jx3-jpfq
    package:
      name: loader-utils
      type: npm
      version: 0.2.17

  ## react-router@6.30.6 (via react-router-dom-v5-compat in drive/docs/drive-store)
  # Accepted risk: fix requires React Router >=7.18.0; apps remain on RR5 + v5-compat layer.
  # Client-side SPA only — no SSR hydration path; v6 is EOL with no backported patch.
  - vulnerability: GHSA-337j-9hxr-rhxg
    reason: >-
      Accepted: RR5 + v5-compat SPA only; no SSR hydration. Patched only in RR >=7.18.0;
      full RR7 migration tracked separately.
    package:
      name: react-router
      type: npm
      version: 6.30.6
  - vulnerability: GHSA-wrjc-x8rr-h8h6
    reason: >-
      Accepted: RR5 + v5-compat SPA only; no SSR hydration. Patched only in RR >=7.18.0;
      full RR7 migration tracked separately.
    package:
      name: react-router
      type: npm
      version: 6.30.6

  ## extract-zip@2.0.1 (via electron@39.8.10 in pass-desktop, @electron/packager on desktop apps)
  # TODO(Pass team): upgrade proton-pass-desktop from electron 39.8.10 to >=43.7.0.
  # Electron 43+ depends on @electron-internal/extract-zip; no patched npm release for extract-zip 2.0.1.
  # Build-time only — electron/electron-packager download pre-built Electron binaries at dev/package time.
  - vulnerability: GHSA-jmr9-qjv8-65gv
    reason: >-
      Accepted: build-time tooling via electron@39.8.10 (pass-desktop) and @electron/packager;
      not shipped in production bundles. TODO(Pass team): upgrade pass-desktop to electron >=43.7.0.
    package:
      name: extract-zip
      type: npm
      version: 2.0.1
  - vulnerability: GHSA-7pqw-9j4j-h8q3
    reason: >-
      Accepted: build-time tooling via electron@39.8.10 (pass-desktop) and @electron/packager;
      not shipped in production bundles. TODO(Pass team): upgrade pass-desktop to electron >=43.7.0.
    package:
      name: extract-zip
      type: npm
      version: 2.0.1

  ## maplibre-gl@4.7.1 (via plotly.js in vendor/rowsncolumns/charts)
  # Accepted risk: plotly.js 3.x pins maplibre-gl ^4.7.1; patch is only in >=6.4.1 which breaks
  # plotly's mapbox traces (maplibre 5/6 dropped/renamed public APIs and @mapbox/* deps).
  # plotly.js is a dev/peer dep of vendored @rowsncolumns/charts; reachable only through the
  # unused ./plotly/basic-chart export subpath — no application imports it, never bundled.
  - vulnerability: GHSA-jrc7-96c5-q579
    reason: >-
      Accepted: transitive via plotly.js dev/peer dep of @rowsncolumns/charts; unused
      ./plotly/basic-chart export, never bundled. Patched only in maplibre-gl >=6.4.1, which
      is incompatible with plotly.js 3.x mapbox trace APIs.
    package:
      name: maplibre-gl
      type: npm
      version: 4.7.1

  ## @protontech/fathom legacy chain (pass-extension build tooling via jsdom@11)
  # Accepted risk: internal pinned package (0.0.38040317) with no newer registry release.
  # jsdom@11 → request/tough-cookie are test/build-time deps, not production runtime.
  - vulnerability: GHSA-p8p7-x288-28g6
    reason: >-
      Accepted: transitive via @protontech/fathom → jsdom@11; pass-extension build/test
      tooling only; request is deprecated and not used in production bundles.
    package:
      name: request
      type: npm
      version: 2.88.2
  - vulnerability: GHSA-72xf-g2v4-qvf3
    reason: >-
      Accepted: transitive via @protontech/fathom → jsdom@11; pass-extension build/test
      tooling only; not used in production bundles.
    package:
      name: tough-cookie
      type: npm
      version: 2.5.0

  ## Rust

  ## glib@0.18.5 (via tauri 2.11 -> gtk-rs 0.18 stack in applications/authenticator)
  # Accepted risk: patched only in glib >=0.20.0. glib reaches the lockfile through the GTK3
  # bindings that Tauri needs on Linux (gtk, gdk, gio, pango, cairo-rs, webkit2gtk, soup3),
  # pulled by tauri-runtime-wry, muda and libappindicator. The gtk crate's latest release is
  # 0.19.0, which still builds on glib 0.19, so no GTK3 binding exists on a patched glib and
  # `cargo update -p glib` resolves no newer version.
  - vulnerability: GHSA-wrw7-89jp-8q8g
    reason: >-
      Accepted: Linux GTK3 dependency chain pulled in by Tauri; the flaw is unsoundness in the
      glib::VariantStrIter iterator impls, which the app never constructs. Patched only in glib
      >=0.20.0, for which no GTK3 binding crate exists; tracked against a future Tauri/GTK4 move.
    package:
      name: glib
      type: rust-crate
      version: 0.18.5
