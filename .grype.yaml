fail-on-severity: "high"
ignore:
  # Statuses
  - fix-state: not-fixed
  - fix-state: unknown
  - fix-state: wont-fix

  # Vulnerabilities
  # How to fix them:
  #  - remove the entry you aim to fix from the following list
  #  - check in the CI that is failing
  #  - patch/update the target dependency accordingly
  #  - the CI should be green and that's it
  #
  # Keep npm accepted-risk GHSAs in sync with .proton/reviewbot/config.yaml (ignoreRules).

  ## Go
  # Safe to ignore: Go is not used in production. The only Go code in this repo is a
  # change set generation script and is never shipped or executed in a production environment.
  - package:
      type: go-module

  ## Npm
  - vulnerability: GHSA-phwq-j96m-2c2q
    package:
      name: ejs
      type: npm
      version: 2.7.4
  - vulnerability: GHSA-593f-38f6-jp5m
    package:
      name: koa
      type: npm
      version: 2.15.3
  - vulnerability: GHSA-76p3-8jx3-jpfq
    package:
      name: loader-utils
      type: npm
      version: 0.2.17

  ## react-router@6.30.6 (via react-router-dom-v5-compat in drive/docs/drive-store)
  # Accepted risk: fix requires React Router >=7.18.0; apps remain on RR5 + v5-compat layer.
  # Client-side SPA only — no SSR hydration path; v6 is EOL with no backported patch.
  - vulnerability: GHSA-337j-9hxr-rhxg
    reason: >-
      Accepted: RR5 + v5-compat SPA only; no SSR hydration. Patched only in RR >=7.18.0;
      full RR7 migration tracked separately.
    package:
      name: react-router
      type: npm
      version: 6.30.6
  - vulnerability: GHSA-wrjc-x8rr-h8h6
    reason: >-
      Accepted: RR5 + v5-compat SPA only; no SSR hydration. Patched only in RR >=7.18.0;
      full RR7 migration tracked separately.
    package:
      name: react-router
      type: npm
      version: 6.30.6

  ## extract-zip@2.0.1 (via @electron/packager, used by electron-forge on all desktop apps)
  # No patched npm release for extract-zip 2.0.1; @electron/packager 18.3.5 still pins ^2.0.0.
  # Build-time only — electron/electron-packager download pre-built Electron binaries at dev/package time.
  # The electron package itself no longer contributes it: 44+ uses @electron-internal/extract-zip.
  - vulnerability: GHSA-jmr9-qjv8-65gv
    reason: >-
      Accepted: build-time tooling via @electron/packager; not shipped in production bundles.
      No patched release of extract-zip 2.0.1.
    package:
      name: extract-zip
      type: npm
      version: 2.0.1
  - vulnerability: GHSA-7pqw-9j4j-h8q3
    reason: >-
      Accepted: build-time tooling via @electron/packager; not shipped in production bundles.
      No patched release of extract-zip 2.0.1.
    package:
      name: extract-zip
      type: npm
      version: 2.0.1

  ## maplibre-gl@4.7.1 (via plotly.js in vendor/rowsncolumns/charts)
  # Accepted risk: plotly.js 3.x pins maplibre-gl ^4.7.1; patch is only in >=6.4.1 which breaks
  # plotly's mapbox traces (maplibre 5/6 dropped/renamed public APIs and @mapbox/* deps).
  # plotly.js is a dev/peer dep of vendored @rowsncolumns/charts; reachable only through the
  # unused ./plotly/basic-chart export subpath — no application imports it, never bundled.
  - vulnerability: GHSA-jrc7-96c5-q579
    reason: >-
      Accepted: transitive via plotly.js dev/peer dep of @rowsncolumns/charts; unused
      ./plotly/basic-chart export, never bundled. Patched only in maplibre-gl >=6.4.1, which
      is incompatible with plotly.js 3.x mapbox trace APIs.
    package:
      name: maplibre-gl
      type: npm
      version: 4.7.1

  ## @protontech/fathom legacy chain (pass-extension build tooling via jsdom@11)
  # Accepted risk: internal pinned package (0.0.38040317) with no newer registry release.
  # jsdom@11 → request/tough-cookie are test/build-time deps, not production runtime.
  - vulnerability: GHSA-p8p7-x288-28g6
    reason: >-
      Accepted: transitive via @protontech/fathom → jsdom@11; pass-extension build/test
      tooling only; request is deprecated and not used in production bundles.
    package:
      name: request
      type: npm
      version: 2.88.2
  - vulnerability: GHSA-72xf-g2v4-qvf3
    reason: >-
      Accepted: transitive via @protontech/fathom → jsdom@11; pass-extension build/test
      tooling only; not used in production bundles.
    package:
      name: tough-cookie
      type: npm
      version: 2.5.0

  ## braces@3.0.3 (via micromatch and chokidar in webpack-dev-server, tailwindcss, stylelint, fast-glob)
  # Accepted risk: 3.0.3 is the latest release and no patched version is published.
  # Build tooling only — expands glob patterns from repository config, never user input.
  - vulnerability: GHSA-vfj7-8cjw-p6xm
    reason: >-
      Accepted: build/dev tooling expanding repository glob patterns only; no patched release
      exists (3.0.3 is latest); revisit when braces publishes a fix.
    package:
      name: braces
      type: npm
      version: 3.0.3

  ## node-forge@1.4.0 (via google-p12-pem in tests and listhen via netlify-cli in storybook)
  # Accepted risk: 1.4.0 is the latest release and no patched version is published.
  # Test and dev tooling only; neither parent verifies RSA PKCS#1 v1.5 signatures.
  - vulnerability: GHSA-86w9-cpqp-85rv
    reason: >-
      Accepted: e2e test and Netlify dev tooling only, no RSA signature verification in use;
      no patched release exists (1.4.0 is latest); revisit when node-forge publishes a fix.
    package:
      name: node-forge
      type: npm
      version: 1.4.0

  ## sprintf-js@1.0.3 / 1.1.3 (via argparse@1 in nyc coverage, roarr via @electron/get)
  # Accepted risk: 1.1.3 is the latest release and no patched version is published.
  # Coverage and desktop build tooling only, formatting static strings.
  - vulnerability: GHSA-hp3w-g68c-fv3c
    reason: >-
      Accepted: coverage and desktop build tooling with static format strings; no patched
      release exists (1.1.3 is latest); revisit when sprintf-js publishes a fix.
    package:
      name: sprintf-js
      type: npm
      version: 1.0.3
  - vulnerability: GHSA-hp3w-g68c-fv3c
    reason: >-
      Accepted: coverage and desktop build tooling with static format strings; no patched
      release exists (1.1.3 is latest); revisit when sprintf-js publishes a fix.
    package:
      name: sprintf-js
      type: npm
      version: 1.1.3

  ## postcss-selector-parser@6.1.2 (via stylelint 15, tailwindcss 3, purgecss 7, postcss-nested 6)
  # Accepted risk: patched only in 7.1.6; every parent still requires ^6 and the 7.x API is
  # incompatible. Reaching it needs the stylelint 16 and tailwindcss 4 migrations.
  # Build tooling only — parses the repository's own stylesheets.
  - vulnerability: GHSA-rj75-hqrm-r3gf
    reason: >-
      Accepted: build-time CSS tooling parsing repository stylesheets; patched only in 7.1.6;
      blocked on stylelint 16 and tailwindcss 4 migrations.
    package:
      name: postcss-selector-parser
      type: npm
      version: 6.1.2

  ## uuid@3.4.0 / 8.3.2 / 9.0.1 (via request, sockjs, jest-junit, istanbul-lib-processinfo,
  ## socketcluster-client, gaxios and googleapis-common)
  # Accepted risk: patched only in >=11.1.1; parents pin ^3, ^8 and ^9 (sockjs 0.3.24, the latest
  # release, still requires ^8.3.2). The flaw needs a caller-supplied buffer to v3/v5/v6; every
  # parent only calls v1/v4 without one.
  - vulnerability: GHSA-w5hq-g745-h8pq
    reason: >-
      Accepted: parents only call v1/v4 without a buffer argument; patched only in >=11.1.1,
      which no parent release accepts.
    package:
      name: uuid
      type: npm
      version: 3.4.0
  - vulnerability: GHSA-w5hq-g745-h8pq
    reason: >-
      Accepted: parents only call v1/v4 without a buffer argument; patched only in >=11.1.1,
      which no parent release accepts.
    package:
      name: uuid
      type: npm
      version: 8.3.2
  - vulnerability: GHSA-w5hq-g745-h8pq
    reason: >-
      Accepted: parents only call v1/v4 without a buffer argument; patched only in >=11.1.1,
      which no parent release accepts.
    package:
      name: uuid
      type: npm
      version: 9.0.1

  ## Rust

  ## glib@0.18.5 (via tauri 2.11 -> gtk-rs 0.18 stack in applications/authenticator)
  # Accepted risk: patched only in glib >=0.20.0. glib reaches the lockfile through the GTK3
  # bindings that Tauri needs on Linux (gtk, gdk, gio, pango, cairo-rs, webkit2gtk, soup3),
  # pulled by tauri-runtime-wry, muda and libappindicator. The gtk crate's latest release is
  # 0.19.0, which still builds on glib 0.19, so no GTK3 binding exists on a patched glib and
  # `cargo update -p glib` resolves no newer version.
  - vulnerability: GHSA-wrw7-89jp-8q8g
    reason: >-
      Accepted: Linux GTK3 dependency chain pulled in by Tauri; the flaw is unsoundness in the
      glib::VariantStrIter iterator impls, which the app never constructs. Patched only in glib
      >=0.20.0, for which no GTK3 binding crate exists; tracked against a future Tauri/GTK4 move.
    package:
      name: glib
      type: rust-crate
      version: 0.18.5
