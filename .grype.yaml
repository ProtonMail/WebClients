fail-on-severity: "critical"
ignore:
  # Statuses
  - fix-state: not-fixed
  - fix-state: unknown
  - fix-state: wont-fix

  # Vulnerabilities
  # How to fix them:
  #  - remove the entry you aim to fix from the following list
  #  - check in the CI that is failing
  #  - patch/update the target dependency accordingly
  #  - the CI should be green and that's it

  ## Go
  # Safe to ignore: Go is not used in production. The only Go code in this repo is a
  # change set generation script and is never shipped or executed in a production environment.
  - package:
      type: go-module

  ## Npm
  - vulnerability: GHSA-phwq-j96m-2c2q
    package:
      name: ejs
      type: npm
      version: 2.7.4
  - vulnerability: GHSA-593f-38f6-jp5m
    package:
      name: koa
      type: npm
      version: 2.15.3
  - vulnerability: GHSA-76p3-8jx3-jpfq
    package:
      name: loader-utils
      type: npm
      version: 0.2.17

  ## image-size (transitive via appdmg@0.6.6 → electron-installer-dmg → @electron-forge/maker-dmg)
  # Accepted risk: no resolution override; resolves naturally to image-size@0.7.5.
  # Only lockfile consumer. Used at macOS DMG build time to read background image dimensions
  # (trusted build input, typically PNG) — not production runtime, not untrusted user input.
  # image-size-next@2.x rejected: breaks appdmg path+callback API; supply-chain concern for SOC2.
  # No patched upstream release exists (image-size is archived; advisory cites >=2.0.3, never published).
  # 0.7.x lacks JXL/HEIF/JP2 parsers (CVE-2025-71329); ICNS parser present but not exercised by appdmg.
  - vulnerability: CVE-2025-71330
    reason: >-
      Accepted: build-time only via appdmg; natural dep 0.7.5; no vetted upgrade without
      breaking DMG packaging API or adopting unvetted image-size-next fork.
    package:
      name: image-size
      type: npm
      version: 0.7.5
  - vulnerability: GHSA-w3rx-r6r6-pgpr
    reason: >-
      Accepted: build-time only via appdmg; natural dep 0.7.5; no vetted upgrade without
      breaking DMG packaging API or adopting unvetted image-size-next fork.
    package:
      name: image-size
      type: npm
      version: 0.7.5
  - vulnerability: CVE-2025-71329
    reason: >-
      Accepted: 0.7.x lacks affected JXL/HEIF/JP2 parsers; build-time appdmg only.
    package:
      name: image-size
      type: npm
      version: 0.7.5
  - vulnerability: GHSA-5p2g-fcmc-qvqq
    reason: >-
      Accepted: 0.7.x lacks affected JXL/HEIF/JP2 parsers; build-time appdmg only.
    package:
      name: image-size
      type: npm
      version: 0.7.5
